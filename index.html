<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY FAMILY</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f6ef7">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MY FAMILY">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f0f2f5; --surface: #ffffff; --surface-2: #f7f8fa; --surface-3: #eef0f4;
  --border: #e0e3ea; --border-light: #eceef3;
  --text: #1a1d26; --text-2: #4a4f5c; --text-3: #8b90a0;
  --accent: #4f6ef7; --accent-light: #eef1fe; --accent-dark: #3b56d6; --accent-glow: rgba(79,110,247,.12);
  --green: #10b981; --green-light: #ecfdf5; --green-dark: #059669;
  --orange: #f59e0b; --orange-light: #fffbeb;
  --red: #ef4444; --red-light: #fef2f2;
  --violet: #8b5cf6; --violet-light: #f5f3ff;
  --aqua: #06b6d4; --aqua-light: #ecfeff;
  --pink: #ec4899; --pink-light: #fdf2f8;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.1);
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1117;--surface:#1a1d2e;--surface-2:#222639;--surface-3:#2a2e42;
  --border:#2e3348;--border-light:#252940;
  --text:#e8eaf0;--text-2:#a0a4b8;--text-3:#6b7089;
  --accent:#6d8aff;--accent-light:#1c2340;--accent-dark:#8fa5ff;--accent-glow:rgba(109,138,255,.15);
  --green:#34d399;--green-light:#0d2a20;--green-dark:#6ee7b7;
  --orange:#fbbf24;--orange-light:#2d2210;
  --red:#f87171;--red-light:#2d1414;
  --violet:#a78bfa;--violet-light:#1e1640;
  --aqua:#22d3ee;--aqua-light:#0d2a2e;
  --pink:#f472b6;--pink-light:#2d1428;
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 24px rgba(0,0,0,.4);
}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:14px;-webkit-font-smoothing:antialiased}
/* Header */
.header{background:linear-gradient(135deg,#4f6ef7 0%,#7c3aed 50%,#ec4899 100%);padding:24px 16px 20px;text-align:center;position:relative;z-index:50}
.header h1{font-size:24px;font-weight:800;color:#fff;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.header p{color:rgba(255,255,255,.8);font-size:12px;margin-top:2px;font-weight:500}
.app{max-width:720px;margin:0 auto;padding:0 12px 100px}
/* Tabs */
.tab-bar{display:flex;flex-wrap:wrap;gap:5px;padding:10px 0;position:sticky;top:0;z-index:40;background:var(--bg)}
.tab-btn{flex:1 1 auto;min-width:0;padding:7px 6px;border:none;border-radius:20px;background:var(--surface);color:var(--text-2);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:var(--transition);box-shadow:var(--shadow);text-align:center}
.tab-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(79,110,247,.35)}
/* Card */
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);transition:var(--transition)}
.card:hover{box-shadow:var(--shadow-md)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-header h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.card-header h2 .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.icon-blue{background:var(--accent-light);color:var(--accent)}
.icon-green{background:var(--green-light);color:var(--green)}
.icon-orange{background:var(--orange-light);color:var(--orange)}
.icon-red{background:var(--red-light);color:var(--red)}
.icon-violet{background:var(--violet-light);color:var(--violet)}
.icon-aqua{background:var(--aqua-light);color:var(--aqua)}
.icon-pink{background:var(--pink-light);color:var(--pink)}
h3{font-size:13px;font-weight:700;margin:16px 0 8px;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px}
/* Forms */
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;transition:var(--transition)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
select{appearance:auto}
label{font-size:12px;color:var(--text-3);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
@media(max-width:500px){.form-row,.form-row.three{grid-template-columns:1fr}}
/* Buttons */
.btn{padding:9px 18px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:6px;letter-spacing:-.01em}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,110,247,.25)}.btn-primary:hover{background:var(--accent-dark);box-shadow:0 4px 12px rgba(79,110,247,.35)}
.btn-success{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(16,185,129,.25)}
.btn-secondary{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}.btn-secondary:hover{background:var(--surface-3)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
/* Tables */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{font-weight:700;color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:10px 8px;text-align:left;border-bottom:2px solid var(--border);background:var(--surface-2)}
td{padding:10px 8px;border-bottom:1px solid var(--border-light)}
tr:hover td{background:var(--surface-2)}
/* Tags */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.tag-father{background:var(--accent-light);color:var(--accent)}
.tag-mother{background:var(--violet-light);color:var(--violet)}
.tag-son{background:var(--aqua-light);color:var(--aqua)}
.tag-daughter{background:var(--pink-light);color:var(--pink)}
.tag-other{background:var(--surface-3);color:var(--text-3)}
.tag-family{background:var(--orange-light);color:var(--orange)}
.tag-done{background:var(--green-light);color:var(--green)}
.tag-pending{background:var(--orange-light);color:var(--orange)}
.tag-overdue{background:var(--red-light);color:var(--red)}
.tag-inprogress{background:var(--accent-light);color:var(--accent)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface-2);border-radius:12px;padding:14px;text-align:center;border:1px solid var(--border-light);transition:var(--transition)}
.stat:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.stat-val{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat-label{font-size:10px;color:var(--text-3);text-transform:uppercase;font-weight:700;letter-spacing:.8px;margin-top:2px}
/* List items */
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:4px;transition:var(--transition);border:1px solid transparent}
.list-item:hover{background:var(--surface-2);border-color:var(--border-light)}
.list-item input[type="checkbox"]{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
.list-item .item-text{flex:1}
.del-btn{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:18px;padding:0 4px;border-radius:4px;transition:var(--transition)}
.del-btn:hover{color:var(--red);background:var(--red-light)}
/* Export bar */
.export-bar{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 12px}
.export-bar .btn{font-size:11px;padding:5px 12px;border-radius:20px}
/* Member filter */
.member-filter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.member-pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);transition:var(--transition)}
.member-pill:hover{border-color:var(--accent);color:var(--accent)}
.member-pill.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(79,110,247,.25)}
/* Member card */
.member-card{border:1.5px solid var(--border-light);border-radius:12px;padding:16px;margin-bottom:10px;transition:var(--transition);background:var(--surface)}
.member-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
/* History */
.history-item{padding:10px 14px;border-left:4px solid var(--accent);margin-bottom:6px;background:var(--surface-2);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:13px;transition:var(--transition)}
.history-item:hover{background:var(--surface-3)}
.history-item .h-time{font-size:11px;color:var(--text-3);font-weight:500}
.history-item .h-action{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.history-item.h-add{border-left-color:var(--green)}
.history-item.h-edit{border-left-color:var(--accent)}
.history-item.h-delete{border-left-color:var(--red)}
.history-item.h-send{border-left-color:var(--violet)}
/* Bar chart */
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.bar-label{width:90px;text-align:right;color:var(--text-2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:12px}
.bar-track{flex:1;background:var(--surface-2);border-radius:6px;height:22px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);min-width:3px}
.bar-val{width:70px;font-weight:700;font-size:12px;color:var(--text-2)}
/* Total */
.total-row{font-weight:800;font-size:16px;text-align:right;padding:12px 0;color:var(--accent);border-top:2px solid var(--accent)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal h3{margin-bottom:16px;font-size:18px;font-weight:700}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;display:none;box-shadow:var(--shadow-lg)}
.toast.error{background:var(--red)}
.toast.show{display:block;animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* Telegram status */
.tg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px}
.tg-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}.tg-dot.off{background:var(--red)}
/* Settings panel */
.settings-panel{border:1.5px solid var(--border-light);border-radius:12px;padding:18px;margin-bottom:14px;background:var(--surface)}
.settings-panel h3{margin-top:0;font-size:14px}
.step-list{font-size:13px;color:var(--text-2);line-height:1.8;margin:8px 0 14px}
.step-list strong{color:var(--text)}
/* Header chips */
.hdr-chip{position:absolute;top:10px;background:rgba(255,255,255,.2);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;cursor:pointer;backdrop-filter:blur(4px)}
/* Lock */
#lockScreen{position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,#4f6ef7,#7c3aed 50%,#ec4899);align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--surface);border-radius:18px;padding:28px 24px;width:100%;max-width:320px;text-align:center;box-shadow:var(--shadow-lg)}
/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{text-align:center;font-size:11px;font-weight:700;color:var(--text-3);padding:4px 0}
.cal-cell{background:var(--surface-2);border-radius:8px;min-height:48px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:600;border:2px solid transparent;transition:var(--transition)}
.cal-cell:hover{border-color:var(--border)}
.cal-cell.today{background:var(--accent-light);color:var(--accent)}
.cal-cell.sel{border-color:var(--accent)}
.cal-dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.cal-dots i{width:6px;height:6px;border-radius:50%}
/* Print */
@media print{.header,.tab-bar,.btn-row,.export-bar,.del-btn,.btn,.member-filter{display:none!important}.card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}}
@media(max-width:500px){.app{padding:0 8px 100px}.card{padding:14px}.header h1{font-size:20px}}
</style>
</head>
<body>
<div class="header" style="padding-top:34px">
  <h1>🏠 MY FAMILY</h1>
  <p>Family Management Hub</p>
  <span id="meChip" class="hdr-chip" style="left:10px" onclick="pickMe()">👤</span>
  <span id="syncDot" class="hdr-chip" style="right:10px" onclick="syncNow(true)">☁️</span>
</div>
<div id="lockScreen" style="display:none"><div class="lock-box"><div style="font-size:42px">🏠</div><h2 style="margin:6px 0 2px">MY FAMILY</h2><p style="color:var(--text-3);font-size:13px;margin-bottom:14px">Enter the family PIN</p>
  <input id="lockPin" type="password" inputmode="numeric" style="text-align:center;font-size:22px;letter-spacing:8px" onkeydown="if(event.key==='Enter')tryUnlock()"><div id="lockErr" style="color:var(--red);font-size:12px;height:18px;margin-top:6px"></div>
  <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" onclick="tryUnlock()">Unlock</button></div></div>
<div class="app">
  <div class="tab-bar" id="tabs"></div>
  <div id="content"></div>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw-dt804OImuntYlgn_tOAxPo5qSp8NkOH4bxC6RbCVjhQginJEIZODCPFXovlx5Sosyg/exec';
let cloudSyncing=false;
let lastSync=localStorage.getItem('fam_lastSync')||'';

const D={
  load(k,def){try{return JSON.parse(localStorage.getItem('fam_'+k))||def}catch{return def}},
  save(k,v){localStorage.setItem('fam_'+k,JSON.stringify(v))},
  id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
};
let members=D.load('members',[
  {id:'father',name:'Father',role:'Father',age:'',blood:'',height:'',weight:''},
  {id:'mother',name:'Mother',role:'Mother',age:'',blood:'',height:'',weight:''},
  {id:'son',name:'Son',role:'Son',age:'',blood:'',height:'',weight:''}
]);
let budget=D.load('budget',{income:0,expenses:[]});
let tasks=D.load('tasks',[]);
let health=D.load('health',[]);
let grocery=D.load('grocery',[]);
let wishlist=D.load('wishlist',[]);
let history=D.load('history',[]);
let settings=D.load('settings',{tgBotToken:'',tgChatId:''});

// ===== EXTRA STATE =====
let events=[],meals=[],docs=[],ledger=[],rewards=[],goals=[],bills=[],limits={},pinHash='',lastDigest='';
let me=localStorage.getItem('fam_me')||'';
const COLS=['members','expenses','tasks','health','grocery','wishlist','history','events','meals','docs','ledger','rewards','goals','bills'];
const SCAL=['income','limits','pin','tg','lastDigest'];
function getState(){return{members,expenses:budget.expenses,income:budget.income,tasks,health,grocery,wishlist,history,events,meals,docs,ledger,rewards,goals,bills,limits,pin:pinHash,tg:{token:settings.tgBotToken||'',chat:settings.tgChatId||'',morning:settings.morningHour??8,evening:settings.eveningHour??20,on:!!settings.remindersOn},lastDigest}}
function setState(s){if(s.members&&s.members.length)members=s.members;budget={income:s.income??budget.income??0,expenses:s.expenses||[]};
  tasks=s.tasks||[];health=s.health||[];grocery=s.grocery||[];wishlist=s.wishlist||[];history=s.history||[];events=s.events||[];meals=s.meals||[];docs=s.docs||[];ledger=s.ledger||[];rewards=s.rewards||[];goals=s.goals||[];bills=s.bills||[];
  limits=s.limits||{};pinHash=s.pin||'';if(s.tg){settings.tgBotToken=s.tg.token||'';settings.tgChatId=s.tg.chat||'';settings.morningHour=s.tg.morning??8;settings.eveningHour=s.tg.evening??20;settings.remindersOn=!!s.tg.on}lastDigest=s.lastDigest||''}
const _st=D.load('state',null);if(_st)setState(_st);
function localSave(){D.save('state',getState())}
function stampBy(){const s=getState();COLS.forEach(k=>(s[k]||[]).forEach(x=>{if(!x.id)x.id=D.id();if(!x.by&&me&&k!=='members')x.by=me}))}
function saveAll(){stampBy();localSave();scheduleSync()}
const J=x=>JSON.stringify(x===undefined?null:x);
const canon=s=>J([...COLS,...SCAL].map(k=>s[k]??null));
function pd(s){const[a,b,c]=String(s).split('-').map(Number);return new Date(a,(b||1)-1,c||1)}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(v){if(!v)return '';const s=String(v);if(s.includes('T'))return todayStr(new Date(s));return s}
function meName(id){const m=members.find(x=>x.id===(id||me));return m?(m.name||m.role):''}
function whoName(id){return id==='family'?'Family':meName(id)||'?'}

// ===== CLOUD SYNC (3-way merge) =====
let syncTimer=null,syncing=false,syncAgain=false;
function setSyncUI(s){const el=$('syncDot');if(el){el.textContent={idle:'☁️ ✓',busy:'☁️ ⟳',err:'☁️ ⚠'}[s];el.title=s==='err'?'Sync error — tap to retry':'Last sync: '+lastSync}}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500)}
function mergeArr(b,l,c){b=b||[];l=l||[];c=c||[];const B=new Map(b.map(x=>[x.id,x])),L=new Map(l.map(x=>[x.id,x])),C=new Map(c.map(x=>[x.id,x]));const out=[];
  [...new Set([...c.map(x=>x.id),...l.map(x=>x.id)])].forEach(id=>{const bb=B.get(id),ll=L.get(id),cc=C.get(id);const lCh=J(ll)!==J(bb),cCh=J(cc)!==J(bb);
    if(ll&&cc)out.push(lCh?ll:cc);else if(cc){if(!bb||cCh)out.push(cc)}else if(ll){if(!bb||lCh)out.push(ll)}});return out}
function mergeState(b,l,c){const o={};COLS.forEach(k=>o[k]=mergeArr(b[k],l[k],c[k]));
  SCAL.forEach(k=>o[k]=(c[k]===undefined)?l[k]:(J(l[k])!==J(b[k])?l[k]:c[k]));
  o.history.sort((x,y)=>(y.time||'').localeCompare(x.time||''));o.history=o.history.slice(0,150);return o}
async function fetchCloud(){const r=await fetch(API_URL+'?action=readAll');const j=await r.json();if(!j.ok)throw new Error(j.error);const d=j.data;
  const kv={};(d.settings||[]).forEach(x=>{if(x.key)kv[x.key]=x.value});
  if(kv.v){const s={};Object.keys(kv).forEach(k=>{if(k==='v')return;try{s[k]=JSON.parse(kv[k])}catch{s[k]=kv[k]}});return s}
  const S=x=>String(x??'');const inc=(d.expenses||[]).find(e=>e.income);
  return{members:(d.members||[]).length?d.members.map(m=>({...m,id:S(m.id)})):undefined,
    expenses:(d.expenses||[]).filter(e=>e.category!=='Income').map(e=>({id:S(e.id),category:e.category,desc:e.desc,amount:Number(e.amount),date:fmtDate(e.date)})),
    income:inc?Number(inc.income):undefined,
    tasks:(d.tasks||[]).map(t=>({...t,id:S(t.id),assignee:S(t.assignee),due:fmtDate(t.due)})),
    health:(d.health||[]).map(h=>({...h,id:S(h.id),memberId:S(h.memberId),nextAppt:fmtDate(h.nextAppt)})),
    grocery:(d.grocery||[]).map(g=>({...g,id:S(g.id),bought:g.bought==='yes'})),
    wishlist:(d.wishlist||[]).map(w=>({...w,id:S(w.id),forMember:S(w.forMember),targetDate:fmtDate(w.targetDate)}))}}
function toRows(s){const nm=id=>id==='family'?'Family':((s.members||[]).find(m=>m.id===id)||{}).name||id;
  return{members:s.members||[],expenses:(s.expenses||[]).map(e=>({...e,income:s.income})),tasks:(s.tasks||[]).map(t=>({...t,assignee:nm(t.assignee)})),
    health:(s.health||[]).map(h=>({...h,memberId:nm(h.memberId)})),grocery:(s.grocery||[]).map(g=>({...g,bought:g.bought?'yes':'no'})),
    wishlist:(s.wishlist||[]).map(w=>({...w,forMember:nm(w.forMember)})),
    settings:[{key:'v',value:'2'},...[...COLS,...SCAL].map(k=>({key:k,value:JSON.stringify(s[k]??null)}))]}}
async function syncNow(manual){
  if(syncing){syncAgain=true;return}syncing=true;setSyncUI('busy');
  try{const cloud=await fetchCloud();const local=getState();let base=D.load('base',null);
    if(!base)base=JSON.parse(J({members:local.members,income:local.income,limits:local.limits,pin:local.pin,tg:local.tg,lastDigest:local.lastDigest}));
    const m=mergeState(base,local,cloud);
    const changedLocally=canon(getState())!==canon(local);
    if(!changedLocally){setState(m);localSave()}else syncAgain=true;
    let ok=true;
    if(canon(m)!==canon(cloud)){await fetch(API_URL+'?action=writeAll',{method:'POST',body:JSON.stringify(toRows(m))});
      const after=await fetchCloud();ok=canon(after)===canon(m);if(!ok)syncAgain=true}
    if(ok)D.save('base',m);lastSync=new Date().toLocaleString();localStorage.setItem('fam_lastSync',lastSync);setSyncUI('idle');
    if(!changedLocally&&canon(m)!==canon(local)&&!document.querySelector('.modal-bg.open')){renderHeader();renderContent()}
    if(manual)showToast('✅ Synced');checkLock();
  }catch(e){setSyncUI('err');if(manual)showToast('❌ Sync error: '+e.message,true)}
  syncing=false;if(syncAgain){syncAgain=false;setTimeout(()=>syncNow(),500)}}
const loadFromCloud=()=>syncNow(true),syncToCloud=()=>syncNow(true);

function hashPin(p){const str='fam:'+p;let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function checkLock(){const el=$('lockScreen');if(!el)return;if(pinHash&&localStorage.getItem('fam_unlock')!==pinHash){el.style.display='flex';setTimeout(()=>$('lockPin')&&$('lockPin').focus(),50)}else el.style.display='none'}
function tryUnlock(){if(hashPin($('lockPin').value)===pinHash){localStorage.setItem('fam_unlock',pinHash);$('lockPin').value='';checkLock()}else{$('lockErr').textContent='Wrong PIN';$('lockPin').value=''}}

async function sendToTelegram(text){
  if(!settings.tgBotToken||!settings.tgChatId){showToast('⚠️ Set up Telegram Bot in Settings first!',true);return false}
  try{
    const resp=await fetch(`https://api.telegram.org/bot${settings.tgBotToken}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:settings.tgChatId,text,parse_mode:'HTML'})
    });
    const data=await resp.json();
    if(data.ok){showToast('✅ Sent to Telegram!');addHistory('send','Telegram','Message sent');return true}
    else{showToast('❌ '+data.description,true);return false}
  }catch(e){showToast('❌ Network error',true);return false}
}

  h+=exportBar('exportBudgetCSV()','exportBudgetJSON()','exportBudgetXLS()','shareBudgetSend()');
  h+=`<div class="stats">

    <div class="stat"><div class="stat-val" style="color:var(--red)">${fmt(totalExp)}</div><div class="stat-label">Expenses</div></div>
    <div class="stat"><div class="stat-val" style="color:${balance>=0?'var(--green)':'var(--red)'}">${fmt(balance)}</div><div class="stat-label">Balance</div></div>
  </div>
  <div class="btn-row" style="margin-bottom:14px"><button class="btn btn-sm btn-secondary" onclick="editIncome()">✏️ Set Income</button><button class="btn btn-sm btn-primary" onclick="addExpense()">+ Add Expense</button><button class="btn btn-sm btn-secondary" onclick="editLimits()">🎯 Limits</button></div>`+renderLimits();
  if(budget.expenses.length){
    h+=`<table><tr><th>Category</th><th>Description</th><th>Amount</th><th>Date</th><th></th></tr>`;
    [...budget.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(e=>{
      const ri=budget.expenses.indexOf(e);
      h+=`<tr><td><span class="tag" style="background:var(--surface-2);font-size:11px">${e.category}</span></td><td>${e.desc||'—'}</td><td style="font-weight:700">${fmt(e.amount)}</td><td style="font-size:12px;color:var(--text-3)">${e.date||''}</td><td><button class="del-btn" onclick="addHistory('delete','Budget','Removed: '+budget.expenses[${ri}].category);budget.expenses.splice(${ri},1);saveAll();renderContent()">×</button></td></tr>`});
    h+=`</table>`;
    const groups={};budget.expenses.forEach(e=>{if(!groups[e.category])groups[e.category]=0;groups[e.category]+=Number(e.amount)});
    const cats=Object.keys(groups).sort((a,b)=>groups[b]-groups[a]);const max=Math.max(...cats.map(c=>groups[c]),1);
    const barColors=['var(--accent)','var(--violet)','var(--aqua)','var(--orange)','var(--pink)','var(--green)','var(--red)','var(--text-3)'];
    h+=`<h3>Spending by Category</h3>`;
    cats.forEach((c,i)=>{const pct=(groups[c]/max*100).toFixed(0);
      h+=`<div class="bar-row"><span class="bar-label">${c}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColors[i%barColors.length]}"></div></div><span class="bar-val">${fmt(groups[c])}</span></div>`})}
  h+=`</div>`;return h}

const taskPeriods=['Daily','Weekly','Monthly','Yearly'];const taskStatuses=['Pending','In Progress','Done','Overdue'];
function renderTasks(){
  let h=`<div class="card"><div class="card-header"><h2><span class="icon icon-orange">✅</span> Tasks & Goals</h2><button class="btn btn-primary btn-sm" onclick="addTask()">+ Add</button></div>`;
  h+=exportBar('exportTasksCSV()','exportTasksJSON()','exportTasksXLS()','shareTasksSend()');
  h+=`<div class="member-filter" id="taskFilter">
    <span class="member-pill active" onclick="filterTasks('all',this)">All</span>
    ${members.map(m=>`<span class="member-pill" onclick="filterTasks('${m.id}',this)">${m.name||m.role}</span>`).join('')}
    <span class="member-pill" onclick="filterTasks('family',this)">Family</span>
  </div>`;
  if(!tasks.length)h+=`<p style="color:var(--text-3);text-align:center;padding:24px 0">No tasks yet. Tap + Add to create one.</p>`;
  taskPeriods.forEach(period=>{const pt=tasks.filter(t=>t.period===period);if(!pt.length)return;
    h+=`<h3>${period} (${pt.length})</h3>`;
    pt.forEach(t=>{const gi=tasks.indexOf(t);
      const statusTag=t.status==='Done'?'tag-done':t.status==='Overdue'?'tag-overdue':t.status==='In Progress'?'tag-inprogress':'tag-pending';
      const assignee=t.assignee==='family'?'Family':members.find(m=>m.id===t.assignee)?.name||t.assignee;
      const roleTag=t.assignee==='family'?'tag-family':`tag-${(members.find(m=>m.id===t.assignee)?.role||'other').toLowerCase()}`;
      h+=`<div class="list-item" data-member="${t.assignee}">
        <input type="checkbox" ${t.status==='Done'?'checked':''} onchange="toggleTask(${gi})">
        <div class="item-text" style="${t.status==='Done'?'text-decoration:line-through;opacity:.4':''}">
          <div style="font-weight:600">${t.title}</div>
          <div style="font-size:12px;margin-top:2px"><span class="tag ${roleTag}">${assignee}</span> <span class="tag ${statusTag}">${t.status}</span>
          ${t.due?` <span style="color:var(--text-3)">📅 ${t.due}</span>`:''}${t.points?` <span class="tag tag-pending">⭐${t.points}</span>`:''}${t.recur?' 🔁':''}${t.by?` <span style="font-size:11px;color:var(--text-3)">· ${meName(t.by)}</span>`:''}</div>
        </div>
        <button class="btn btn-sm btn-secondary" onclick="editTask(${gi})">✏️</button>
        <button class="del-btn" onclick="addHistory('delete','Tasks','Removed: '+tasks[${gi}].title);tasks.splice(${gi},1);saveAll();renderContent()">×</button>
      </div>`})});
  h+=`</div>`;return h}
function toggleTask(i){const t=tasks[i];t.status=t.status==='Done'?'Pending':'Done';
  if(t.status==='Done'){t.doneAt=todayStr();if(t.points>0&&t.assignee!=='family')ledger.push({id:D.id(),memberId:t.assignee,pts:t.points,reason:'✅ '+t.title,date:new Date().toISOString(),taskId:t.id});if(t.points>0)showToast('⭐ +'+t.points+' points!')}
  else{const k=ledger.findIndex(l=>l.taskId===t.id&&(l.date||'').slice(0,10)===todayStr());if(k>=0)ledger.splice(k,1)}addHistory('edit','Tasks',(tasks[i].status==='Done'?'✅ Completed':'Reopened')+': '+tasks[i].title);saveAll();renderContent()}

  <div class="form-row" style="margin-top:10px"><div><label>Period</label><select id="tp">${taskPeriods.map(p=>`<option ${t.period===p?'selected':''}>${p}</option>`).join('')}</select></div>

// ===== CALENDAR =====
let calMonth=new Date();calMonth.setDate(1);let calSel=todayStr();
const kindColor={event:'var(--accent)',bday:'var(--pink)',task:'var(--orange)',appt:'var(--red)',doc:'var(--violet)'};
function itemsOn(ds){const out=[];const D0=pd(ds);const [y,mo,da]=ds.split('-').map(Number);
  events.forEach(e=>{if(!e.date)return;const E=pd(e.date);if(D0<E)return;const r=e.repeat||'none';
    const hit=r==='yearly'?(E.getMonth()===mo-1&&E.getDate()===da):r==='monthly'?E.getDate()===da:r==='weekly'?E.getDay()===D0.getDay():r==='daily'?true:e.date===ds;
    if(hit)out.push({icon:'📌',title:(e.time?e.time+' · ':'')+e.title,who:e.memberId,kind:'event',id:e.id,time:e.time||''})});
  members.forEach(m=>{if(m.birthday&&m.birthday.slice(5)===ds.slice(5))out.push({icon:'🎂',title:(m.name||m.role)+' — birthday'+(m.birthday.slice(0,4)<y?` (turns ${y-Number(m.birthday.slice(0,4))})`:''),who:m.id,kind:'bday'})});
  tasks.forEach(t=>{if(t.due===ds)out.push({icon:t.status==='Done'?'✅':'⬜',title:t.title,who:t.assignee,kind:'task'})});
  health.forEach(h=>{if(h.nextAppt===ds)out.push({icon:'🏥',title:'Doctor: '+(h.doctor||h.condition||''),who:h.memberId,kind:'appt'})});
  docs.forEach(d=>{if(d.expiry===ds)out.push({icon:'📄',title:d.title+' — expires',who:d.memberId,kind:'doc'})});
  return out.sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function renderCalendar(){const y=calMonth.getFullYear(),m=calMonth.getMonth();const first=(new Date(y,m,1).getDay()+6)%7;const days=new Date(y,m+1,0).getDate();const t=todayStr();
  const mn=['January','February','March','April','May','June','July','August','September','October','November','December'];
  let h=`<div class="card"><div class="card-header"><h2><span class="icon icon-blue">📅</span> Family Calendar</h2><button class="btn btn-primary btn-sm" onclick="addEvent()">+ Event</button></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button class="btn btn-secondary btn-sm" onclick="calMonth.setMonth(calMonth.getMonth()-1);renderContent()">◀</button>
  <strong style="font-size:16px">${mn[m]} ${y}</strong><button class="btn btn-secondary btn-sm" onclick="calMonth.setMonth(calMonth.getMonth()+1);renderContent()">▶</button></div>
  <div class="cal-grid">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<div class="cal-head">${d}</div>`).join('')}${'<div></div>'.repeat(first)}`;
  for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const it=itemsOn(ds);
    h+=`<div class="cal-cell ${ds===t?'today':''} ${ds===calSel?'sel':''}" onclick="calSel='${ds}';renderContent()"><span>${d}</span><div class="cal-dots">${it.slice(0,4).map(i=>`<i style="background:${kindColor[i.kind]}"></i>`).join('')}</div></div>`}
  h+=`</div><div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin-top:8px">${[['event','Event'],['bday','Birthday'],['task','Task'],['appt','Doctor'],['doc','Document']].map(([k,l])=>`<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${kindColor[k]}"></i> ${l}</span>`).join('')}</div></div>`;
  const it=itemsOn(calSel);
  h+=`<div class="card"><div class="card-header"><h2><span class="icon icon-violet">🗓️</span> ${calSel}</h2><button class="btn btn-primary btn-sm" onclick="addEvent('${calSel}')">+ Add to this day</button></div>`;
  h+=it.length?it.map(i=>`<div class="list-item" style="border-left:4px solid ${kindColor[i.kind]}"><span style="font-size:18px">${i.icon}</span><div class="item-text"><div style="font-weight:600">${i.title}</div>${i.who?`<span class="tag tag-other">${whoName(i.who)}</span>`:''}</div>${i.kind==='event'?`<button class="btn btn-sm btn-secondary" onclick="editEvent('${i.id}')">✏️</button>`:''}</div>`).join(''):`<p style="color:var(--text-3);text-align:center;padding:16px;font-style:italic">Nothing on this day.</p>`;
  return h+`</div>`}
function eventForm(e){return `<label>Title</label><input id="evT" value="${e.title||''}" placeholder="e.g. Wedding, Parent meeting">
  <div class="form-row" style="margin-top:10px"><div><label>Date</label><input id="evD" type="date" value="${e.date||calSel}"></div><div><label>Time</label><input id="evTm" type="time" value="${e.time||''}"></div></div>

// ===== RECURRING TASKS =====
function periodKey(p,d){d=d||new Date();if(p==='Daily')return todayStr(d);if(p==='Weekly'){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return todayStr(x)}if(p==='Monthly')return todayStr(d).slice(0,7);return String(d.getFullYear())}
function resetRecurring(){let ch=false;tasks.forEach(t=>{if(t.recur&&t.status==='Done'&&t.doneAt&&periodKey(t.period,pd(t.doneAt))!==periodKey(t.period)){t.status='Pending';ch=true}});if(ch)saveAll()}

    h+=`</div></div>`});return h+`</div>`}
function editMeal(id,date,slot){const ml=id?meals.find(x=>x.id===id):{date,slot,dish:'',ingredients:''};const dishes=[...new Set(meals.map(x=>x.dish).filter(Boolean))];

  <div class="btn-row"><button class="btn btn-primary" onclick="saveMeal('${id||''}','${ml.date}','${ml.slot}')">Save</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>${id?`<button class="btn btn-danger btn-sm" onclick="meals=meals.filter(x=>x.id!=='${id}');saveAll();closeModal();renderContent()">Delete</button>`:''}</div>`)}
function saveMeal(id,date,slot){const dish=$('mlD').value.trim();if(!dish)return;const v={dish,ingredients:$('mlI').value.trim()};
  if(id){const i=meals.findIndex(x=>x.id===id);meals[i]={...meals[i],...v}}else meals.push({id:D.id(),date,slot,...v});addHistory('add','Menu',dish+' ('+date+')');saveAll();closeModal();renderContent()}
function mealsToGrocery(){const wd=weekDays();const have=new Set(grocery.filter(g=>!g.bought).map(g=>g.name.trim().toLowerCase()));let n=0;
  meals.filter(m=>wd.includes(m.date)).forEach(m=>(m.ingredients||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(ing=>{if(!have.has(ing.toLowerCase())){have.add(ing.toLowerCase());grocery.push({id:D.id(),name:ing,qty:1,unit:'kg',price:0,category:'Other',bought:false});n++}}));
  if(n){addHistory('add','Grocery',n+' ingredients from menu');saveAll()}showToast(n?`🛒 ${n} ingredients added`:'No new ingredients')}

function daysLeft(ds){return Math.round((pd(ds)-pd(todayStr()))/86400000)}
function renderDocs(){const list=[...docs].sort((a,b)=>(a.expiry||'9').localeCompare(b.expiry||'9'));

function editDoc(id){const d=id?docs.find(x=>x.id===id):{};openModal(`<h3>📄 Document</h3><label>Name</label><input id="dcT" list="docTypes" value="${d.title||''}" placeholder="Passport"><datalist id="docTypes">${['Passport','ID card','International passport','Driver\'s license','Car insurance','Vehicle inspection','Health insurance','Visa'].map(x=>`<option value="${x}">`).join('')}</datalist>
  <div class="form-row" style="margin-top:10px"><div><label>Owner</label><select id="dcM"><option value="family">Family</option>${members.map(m=>`<option value="${m.id}" ${d.memberId===m.id?'selected':''}>${m.name||m.role}</option>`).join('')}</select></div><div><label>Expiry date</label><input id="dcE" type="date" value="${d.expiry||''}"></div></div>

function saveDoc(id){const v={title:$('dcT').value.trim(),memberId:$('dcM').value,expiry:$('dcE').value};if(!v.title)return;
  if(id){const i=docs.findIndex(x=>x.id===id);docs[i]={...docs[i],...v}}else docs.push({id:D.id(),...v});addHistory('add','Document',v.title);saveAll();closeModal();renderContent()}

// ===== BUDGET LIMITS =====
function monthSpend(){const mk=todayStr().slice(0,7);const g={};budget.expenses.filter(e=>(e.date||'').slice(0,7)===mk).forEach(e=>g[e.category]=(g[e.category]||0)+Number(e.amount||0));return g}
function limitWarnings(){const g=monthSpend();return Object.keys(limits).filter(c=>Number(limits[c])>0&&(g[c]||0)>=Number(limits[c])*0.8).map(c=>({c,spent:g[c]||0,lim:Number(limits[c])}))}
function renderLimits(){const g=monthSpend();const cats=Object.keys(limits).filter(c=>Number(limits[c])>0);if(!cats.length)return '';
  let h=`<h3>🎯 This Month's Limits</h3>`;cats.forEach(c=>{const s=g[c]||0,l=Number(limits[c]);const p=Math.min(100,s/l*100);const col=s>l?'var(--red)':s>=l*.8?'var(--orange)':'var(--green)';
    h+=`<div class="bar-row"><span class="bar-label">${c}</span><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${col}"></div></div><span class="bar-val" style="width:auto;color:${col}">${fmt(s)} / ${fmt(l)}</span></div>`});return h}
function editLimits(){openModal(`<h3>🎯 Monthly Limits</h3><p style="font-size:12px;color:var(--text-3);margin-bottom:10px">Leave empty for no limit. You'll be warned at 80%.</p>
  ${expCats.map((c,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="flex:1;font-size:13px">${c}</span><input id="lim${i}" type="number" style="width:140px" value="${limits[c]||''}"></div>`).join('')}
  <div class="btn-row"><button class="btn btn-primary" onclick="limits={};expCats.forEach((c,i)=>{const v=Number($('lim'+i).value);if(v>0)limits[c]=v});addHistory('edit','Budget','Limits updated');saveAll();closeModal();renderContent()">Save</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>`)}

// ===== TODAY & DIGEST =====
function upcoming(n){const out=[];for(let i=1;i<=n;i++){const d=new Date();d.setDate(d.getDate()+i);const ds=todayStr(d);itemsOn(ds).filter(x=>x.kind!=='task').forEach(x=>out.push({...x,ds,i}))}return out}
function todayData(){const t=todayStr();return{t,items:itemsOn(t),overdue:tasks.filter(x=>x.due&&x.due<t&&x.status!=='Done'),
  daily:tasks.filter(x=>x.period==='Daily'&&x.recur&&x.status!=='Done'),meals:mealSlots.map(s=>meals.find(m=>m.date===t&&m.slot===s)).filter(Boolean),
  meds:health.filter(h=>h.medication&&/Daily/.test(h.frequency||'')),up:upcoming(7),billsDue:billsDue(3),docsSoon:docs.filter(d=>d.expiry&&daysLeft(d.expiry)<=30),warn:limitWarnings()}}
function renderToday(){const T=todayData();const li=(icon,txt,sub,col)=>`<div class="list-item" style="border-left:4px solid ${col||'var(--border)'}"><span style="font-size:17px">${icon}</span><div class="item-text"><div style="font-weight:600">${txt}</div>${sub?`<div style="font-size:11px;color:var(--text-3)">${sub}</div>`:''}</div></div>`;
  let h=`<div class="card"><div class="card-header"><h2><span class="icon icon-orange">☀️</span> Today · ${T.t}</h2><button class="btn btn-sm btn-secondary" onclick="sharePicker('Daily summary',digestText())">📨</button></div>`;let any=false;
  if(T.items.length){any=true;T.items.forEach(i=>h+=li(i.icon,i.title,i.who?whoName(i.who):'',kindColor[i.kind]))}
  if(T.overdue.length){any=true;h+=`<h3 style="color:var(--red)">⚠️ Overdue</h3>`;T.overdue.forEach(x=>h+=li('⏰',x.title,whoName(x.assignee)+' · '+x.due,'var(--red)'))}
  if(T.daily.length){any=true;h+=`<h3>🔁 Daily Tasks</h3>`;T.daily.forEach(x=>h+=li('⬜',x.title,whoName(x.assignee)+(x.points?` · ⭐${x.points}`:''),'var(--orange)'))}
  if(T.meals.length){any=true;h+=`<h3>🍽️ Today's Menu</h3>`;T.meals.forEach(m=>h+=li('🍲',m.dish,m.slot,'var(--green)'))}
  if(T.meds.length){any=true;h+=`<h3>💊 Medications</h3>`;T.meds.forEach(x=>h+=li('💊',x.medication+' '+(x.dosage||''),meName(x.memberId)+' · '+x.frequency,'var(--red)'))}
  if(T.warn.length){any=true;h+=`<h3>💸 Budget Warnings</h3>`;T.warn.forEach(w=>h+=li(w.spent>w.lim?'🔴':'🟠',w.c,fmt(w.spent)+' / '+fmt(w.lim),w.spent>w.lim?'var(--red)':'var(--orange)'))}
  if(T.billsDue.length){any=true;h+=`<h3>🔁 Bills due</h3>`;T.billsDue.forEach(b=>h+=li(b.dl<0?'🔴':'🟠',b.name+' — '+fmt(b.amount),b.dl<0?'overdue '+(-b.dl)+' days':b.dl===0?'today':'in '+b.dl+' days','var(--orange)'))}
  if(T.docsSoon.length){any=true;h+=`<h3>📄 Document Expiry</h3>`;T.docsSoon.forEach(d=>{const dl=daysLeft(d.expiry);h+=li('📄',d.title,whoName(d.memberId)+' · '+(dl<0?'expired':dl+' days left'),'var(--violet)')})}
  if(T.up.length){any=true;h+=`<h3>🔜 Next 7 Days</h3>`;T.up.forEach(x=>h+=li(x.icon,x.title,x.ds+(x.i===1?' · tomorrow':''),kindColor[x.kind]))}
  if(!any)h+=`<p style="color:var(--text-3);text-align:center;padding:16px;font-style:italic">Nothing for today 🎉</p>`;
  return h+`</div>`}
function digestText(){const T=todayData();let s=`☀️ MY FAMILY — ${T.t}\n`;const sec=(t,arr)=>{if(arr.length)s+=`\n${t}\n`+arr.map(x=>'• '+x).join('\n')+'\n'};
  sec('📅 Today:',T.items.map(i=>i.icon+' '+i.title+(i.who?' ('+whoName(i.who)+')':'')));
  sec('⚠️ Overdue:',T.overdue.map(x=>x.title+' — '+whoName(x.assignee)));
  sec('🔁 Daily:',T.daily.map(x=>x.title+' — '+whoName(x.assignee)));
  sec('🍽️ Menu:',T.meals.map(m=>m.slot+': '+m.dish));
  sec('💊 Medications:',T.meds.map(x=>meName(x.memberId)+': '+x.medication+' '+(x.dosage||'')));
  sec('💸 Budget:',T.warn.map(w=>w.c+': '+fmt(w.spent)+' / '+fmt(w.lim)));
  sec('🔁 Bills due:',T.billsDue.map(b=>b.name+': '+fmt(b.amount)+' ('+(b.dl<0?'overdue':b.dl===0?'today':'in '+b.dl+'d')+')'));
  sec('📄 Documents:',T.docsSoon.map(d=>d.title+' ('+whoName(d.memberId)+') — '+daysLeft(d.expiry)+' days'));
  sec('🔜 Coming up:',T.up.map(x=>x.ds.slice(5)+' '+x.icon+' '+x.title));return s}
function maybeDigest(){const t=todayStr();if(false&&settings.tgBotToken&&settings.tgChatId&&lastDigest!==t&&new Date().getHours()>=7){lastDigest=t;saveAll();sendToTelegram(digestText())}}

// ===== SAVINGS GOALS =====
function monthsLeft(ds){if(!ds)return null;const a=new Date(),b=pd(ds);return Math.max(1,(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())}
function renderGoals(){let h=`<div class="card"><div class="card-header"><h2><span class="icon icon-green">🐷</span> Savings Goals</h2><button class="btn btn-primary btn-sm" onclick="editGoal()">+ Goal</button></div>`;
  if(!goals.length)return h+`<p style="color:var(--text-3);text-align:center;padding:16px;font-style:italic">e.g. Emergency fund, Summer trip, New car</p></div>`;
  const tot=goals.reduce((s,g)=>s+Number(g.saved||0),0),tgt=goals.reduce((s,g)=>s+Number(g.target||0),0);
  h+=`<div class="stats"><div class="stat"><div class="stat-val" style="color:var(--green)">${fmt(tot)}</div><div class="stat-label">Saved</div></div><div class="stat"><div class="stat-val" style="color:var(--accent)">${fmt(tgt)}</div><div class="stat-label">Target</div></div><div class="stat"><div class="stat-val" style="color:var(--violet)">${tgt?Math.round(tot/tgt*100):0}%</div><div class="stat-label">Progress</div></div></div>`;
  goals.forEach(g=>{const p=g.target?Math.min(100,g.saved/g.target*100):0;const left=Math.max(0,g.target-g.saved);const ml=monthsLeft(g.deadline);const done=left<=0;
    h+=`<div class="member-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><strong style="font-size:15px">${done?'🎉 ':''}${g.name}</strong> <span class="tag tag-other">${whoName(g.forMember||'family')}</span></div>
      <div style="display:flex;gap:4px"><button class="btn btn-sm btn-success" onclick="contribute('${g.id}')">+ Add</button><button class="btn btn-sm btn-secondary" onclick="editGoal('${g.id}')">✏️</button></div></div>
      <div class="bar-track" style="margin:10px 0 6px;height:14px"><div class="bar-fill" style="width:${p}%;background:${done?'var(--green)':'var(--accent)'}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)"><span><strong>${fmt(g.saved)}</strong> / ${fmt(g.target)} (${Math.round(p)}%)</span><span>${done?'Reached!':ml?`≈ ${fmt(Math.ceil(left/ml))}/month · ${g.deadline}`:fmt(left)+' left'}</span></div></div>`});
  return h+`</div>`}
function editGoal(id){const g=id?goals.find(x=>x.id===id):{};openModal(`<h3>🐷 ${id?'Edit':'New'} Goal</h3><label>Name</label><input id="glN" value="${g.name||''}" placeholder="e.g. Emergency fund">
  <div class="form-row" style="margin-top:10px"><div><label>Target amount</label><input id="glT" type="number" value="${g.target||''}"></div><div><label>Already saved</label><input id="glS" type="number" value="${g.saved||0}"></div></div>
  <div class="form-row"><div><label>Deadline</label><input id="glD" type="date" value="${g.deadline||''}"></div><div><label>For</label><select id="glF"><option value="family">Family</option>${members.map(m=>`<option value="${m.id}" ${g.forMember===m.id?'selected':''}>${m.name||m.role}</option>`).join('')}</select></div></div>
  <div class="btn-row"><button class="btn btn-primary" onclick="saveGoal('${id||''}')">Save</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>${id?`<button class="btn btn-danger btn-sm" onclick="goals=goals.filter(x=>x.id!=='${id}');saveAll();closeModal();renderContent()">Delete</button>`:''}</div>`)}
function saveGoal(id){const v={name:$('glN').value.trim(),target:Number($('glT').value)||0,saved:Number($('glS').value)||0,deadline:$('glD').value,forMember:$('glF').value};if(!v.name)return;
  if(id){const i=goals.findIndex(x=>x.id===id);goals[i]={...goals[i],...v}}else goals.push({id:D.id(),...v});addHistory(id?'edit':'add','Goals',v.name);saveAll();closeModal();renderContent()}
function contribute(id){const g=goals.find(x=>x.id===id);openModal(`<h3>🐷 ${g.name}</h3><label>Amount (negative = withdraw)</label><input id="ctA" type="number" placeholder="0">
  <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;color:var(--text-2);margin-top:10px"><input id="ctE" type="checkbox" checked style="width:18px;height:18px"> Also record as "Savings" expense in budget</label>
  <div class="btn-row"><button class="btn btn-success" onclick="doContribute('${id}')">Save</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button></div>`)}
function doContribute(id){const a=Number($('ctA').value);if(!a)return;const g=goals.find(x=>x.id===id);const was=g.saved>=g.target;g.saved=Number(g.saved||0)+a;
  if($('ctE').checked&&a>0)budget.expenses.push({id:D.id(),category:'Savings',desc:'🐷 '+g.name,amount:a,date:todayStr()});
  addHistory('add','Goals',g.name+': '+(a>0?'+':'')+fmt(a));saveAll();closeModal();renderContent();showToast(!was&&g.saved>=g.target?'🎉 Goal reached!':'✅ Saved')}

// ===== RECURRING BILLS =====
function billDate(b,mk){mk=mk||todayStr().slice(0,7);const [y,m]=mk.split('-').map(Number);const last=new Date(y,m,0).getDate();return mk+'-'+String(Math.min(Number(b.day)||1,last)).padStart(2,'0')}
function billPaid(b,mk){mk=mk||todayStr().slice(0,7);return budget.expenses.some(e=>e.id==='bill-'+b.id+'-'+mk)}
function payBill(id,silent){const b=bills.find(x=>x.id===id);const mk=todayStr().slice(0,7);if(billPaid(b,mk))return false;
  budget.expenses.push({id:'bill-'+b.id+'-'+mk,category:b.category,desc:'🔁 '+b.name,amount:Number(b.amount),date:billDate(b,mk)});addHistory('add','Bills',b.name+': '+fmt(b.amount));
  if(!silent){saveAll();renderContent();showToast('✅ Marked as paid')}return true}
function autoBills(){const t=todayStr();let n=0;bills.forEach(b=>{if(b.auto&&billDate(b)<=t&&payBill(b.id,true))n++});if(n){saveAll();renderContent()}}
function billsDue(days){const t=todayStr();return bills.filter(b=>!billPaid(b)).map(b=>({...b,due:billDate(b),dl:daysLeft(billDate(b))})).filter(b=>b.dl<=days).sort((a,b)=>a.dl-b.dl)}
function renderBills(){const mk=todayStr().slice(0,7);const total=bills.reduce((s,b)=>s+Number(b.amount||0),0);const paid=bills.filter(b=>billPaid(b,mk)).reduce((s,b)=>s+Number(b.amount||0),0);
  let h=`<div class="card"><div class="card-header"><h2><span class="icon icon-orange">🔁</span> Recurring Bills</h2><button class="btn btn-primary btn-sm" onclick="editBill()">+ Bill</button></div>`;
  if(!bills.length)return h+`<p style="color:var(--text-3);text-align:center;padding:16px;font-style:italic">e.g. Electricity, Gas, Internet, Loan, School fee</p></div>`;
  h+=`<div class="stats"><div class="stat"><div class="stat-val" style="color:var(--accent)">${fmt(total)}</div><div class="stat-label">Monthly</div></div><div class="stat"><div class="stat-val" style="color:var(--green)">${fmt(paid)}</div><div class="stat-label">Paid this month</div></div><div class="stat"><div class="stat-val" style="color:var(--orange)">${fmt(total-paid)}</div><div class="stat-label">Remaining</div></div></div>`;
  [...bills].sort((a,b)=>a.day-b.day).forEach(b=>{const p=billPaid(b,mk);const dl=daysLeft(billDate(b));
    h+=`<div class="list-item"><span style="font-size:18px">${p?'✅':dl<0?'🔴':dl<=3?'🟠':'⚪'}</span><div class="item-text"><strong>${b.name}</strong><div style="font-size:12px;color:var(--text-3)">Day ${b.day} · ${b.category}${b.auto?' · auto':''}${p?'':dl<0?` · <span style="color:var(--red)">overdue ${-dl}d</span>`:dl===0?' · <strong>today</strong>':` · in ${dl}d`}</div></div>
      <strong style="font-size:13px">${fmt(b.amount)}</strong>${p?'':`<button class="btn btn-sm btn-success" onclick="payBill('${b.id}')">Paid</button>`}<button class="btn btn-sm btn-secondary" onclick="editBill('${b.id}')">✏️</button></div>`});
  return h+`</div>`}
function editBill(id){const b=id?bills.find(x=>x.id===id):{day:1,category:'Utilities',auto:false};openModal(`<h3>🔁 ${id?'Edit':'New'} Bill</h3><label>Name</label><input id="blN" value="${b.name||''}" placeholder="e.g. Electricity">
  <div class="form-row" style="margin-top:10px"><div><label>Amount</label><input id="blA" type="number" value="${b.amount||''}"></div><div><label>Day of month</label><input id="blD" type="number" min="1" max="31" value="${b.day||1}"></div></div>
  <label>Category</label><select id="blC">${expCats.map(c=>`<option ${b.category===c?'selected':''}>${c}</option>`).join('')}</select>
  <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px;color:var(--text-2);margin-top:10px"><input id="blAu" type="checkbox" ${b.auto?'checked':''} style="width:18px;height:18px"> Add to expenses automatically on due day (for auto-debit payments)</label>
  <div class="btn-row"><button class="btn btn-primary" onclick="saveBill('${id||''}')">Save</button><button class="btn btn-secondary" onclick="closeModal()">Cancel</button>${id?`<button class="btn btn-danger btn-sm" onclick="bills=bills.filter(x=>x.id!=='${id}');saveAll();closeModal();renderContent()">Delete</button>`:''}</div>`)}
function saveBill(id){const v={name:$('blN').value.trim(),amount:Number($('blA').value)||0,day:Math.min(31,Math.max(1,Number($('blD').value)||1)),category:$('blC').value,auto:$('blAu').checked};if(!v.name)return;
  if(id){const i=bills.findIndex(x=>x.id===id);bills[i]={...bills[i],...v}}else bills.push({id:D.id(),...v});addHistory(id?'edit':'add','Bills',v.name);saveAll();closeModal();renderContent();autoBills()}

// ===== INSTALL (PWA) =====
let deferredInstall=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  openModal(`<h3>📲 Install on phone</h3><p style="font-size:14px;color:var(--text-2);line-height:1.7">${location.protocol!=='https:'?'Open the app from its <strong>website link</strong> (not a downloaded file) to install it.<br><br>':''}${ios?'In <strong>Safari</strong>: tap <strong>Share</strong> ⬆️ → <strong>Add to Home Screen</strong>.':'In <strong>Chrome</strong>: tap menu <strong>⋮</strong> → <strong>Install app</strong> / <strong>Add to Home screen</strong>.'}</p><div class="btn-row"><button class="btn btn-secondary" onclick="closeModal()">OK</button></div>`)}
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('claude.ai'))navigator.serviceWorker.register('sw.js').catch(()=>{});

// ===== SETTINGS =====
function renderSettings(){
  const tgOk=settings.tgBotToken&&settings.tgChatId;
  return `<div class="card"><div class="card-header"><h2><span class="icon icon-blue">⚙️</span> Settings</h2></div>

    <div class="settings-panel" style="border-color:${tgOk?'var(--green)':'var(--border-light)'}">
      <h3>📨 Telegram Bot ${tgOk?'<span class="tag tag-done">Connected</span>':'<span class="tag tag-overdue">Not Set Up</span>'}</h3>
      <div class="step-list">
        <strong>Setup (one-time, 2 min):</strong><br>
        1️⃣ Open Telegram → search <strong>@BotFather</strong> → send <code>/newbot</code><br>
        2️⃣ Copy the <strong>Bot Token</strong> → paste below<br>
        3️⃣ For personal: search <strong>@userinfobot</strong> → get your Chat ID<br>
        4️⃣ For group: add bot to group → send msg → get group Chat ID<br>
        5️⃣ Save → Test ✅
      </div>
      <label>Bot Token</label>
      <input id="stgToken" type="password" value="${settings.tgBotToken}" placeholder="123456789:ABCdefGHIjklMNOpqrsTUVwxyz">
      <label style="margin-top:10px">Chat ID</label>
      <input id="stgChat" value="${settings.tgChatId}" placeholder="e.g. 123456789 or -1001234567890">
      <div class="btn-row">
        <button class="btn btn-primary" onclick="settings.tgBotToken=$('stgToken').value.trim();settings.tgChatId=$('stgChat').value.trim();saveAll();renderContent();showToast('✅ Saved!')">💾 Save</button>
        <button class="btn btn-success" onclick="sendToTelegram('✅ MY FAMILY app connected! Test successful.')">🧪 Test</button>
        ${tgOk?`<button class="btn btn-danger btn-sm" onclick="settings.tgBotToken='';settings.tgChatId='';saveAll();renderContent()">Disconnect</button>`:''}
      </div>
    </div>

    <div class="settings-panel">
      <h3>📧 Gmail</h3>
      <p style="font-size:13px;color:var(--text-2)">Opens Gmail compose in a new tab. No setup needed.</p>
    </div>

    <div class="settings-panel"><h3>📲 Install as app</h3><p style="font-size:13px;color:var(--text-2)">Put MY FAMILY on your phone home screen like a real app.</p><div class="btn-row"><button class="btn btn-primary" onclick="installApp()">📲 Install</button></div></div>
    <div class="settings-panel" style="border-color:var(--accent)">
      <h3>👤 This device: ${meName()||'not set'}</h3>
      <div class="btn-row"><button class="btn btn-primary" onclick="pickMe()">👤 Change who I am</button></div>
    </div>
    <div class="settings-panel" style="border-color:${pinHash?'var(--green)':'var(--border-light)'}">
      <h3>🔒 PIN Protection ${pinHash?'<span class="tag tag-done">On</span>':'<span class="tag tag-overdue">Off</span>'}</h3>
      <p style="font-size:13px;color:var(--text-2)">A family PIN is asked when the app opens. This is basic protection — the real safeguard is not sharing the file and link with outsiders.</p>
      <div class="btn-row"><button class="btn btn-primary" onclick="setPin()">${pinHash?'Change PIN':'Set PIN'}</button>${pinHash?'<button class="btn btn-secondary" onclick="lockNow()">🔒 Lock now</button>':''}</div>
    </div>
    <div class="settings-panel" style="border-color:${settings.remindersOn?'var(--green)':'var(--border-light)'}">
      <h3>⏰ Telegram Reminders ${settings.remindersOn?'<span class="tag tag-done">On</span>':'<span class="tag tag-overdue">Off</span>'}</h3>
      <p style="font-size:13px;color:var(--text-2)">Sent by Google at exact times — even if nobody opens the app. Morning: today's events, tasks, bills, birthdays, documents. Evening: medications, unfinished daily tasks and tomorrow's plan. (Requires the reminder setup in Apps Script — one time.)</p>
      <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;color:var(--text);margin-top:10px"><input type="checkbox" style="width:18px;height:18px" ${settings.remindersOn?'checked':''} onchange="settings.remindersOn=this.checked;saveAll();renderContent()"> Send reminders</label>
      <div class="form-row" style="margin-top:10px"><div><label>Morning summary</label><select onchange="settings.morningHour=Number(this.value);saveAll()">${[...Array(24).keys()].map(h=>`<option value="${h}" ${Number(settings.morningHour??0)===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></div>
      <div><label>Evening reminder</label><select onchange="settings.eveningHour=Number(this.value);saveAll()">${[...Array(24).keys()].map(h=>`<option value="${h}" ${Number(settings.eveningHour??0)===h?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('')}</select></div></div>
      <div class="btn-row"><button class="btn btn-secondary" onclick="sendToTelegram(digestText())">📨 Send today's summary now</button></div>
    </div>
    <div class="settings-panel" style="border-color:var(--green)">
      <h3>☁️ Cloud Sync <span class="tag tag-done">Automatic</span></h3>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:8px">Changes are sent to Google Sheets automatically, and updates from other devices are pulled every 45 seconds. Nothing is lost even if you edit different entries at the same time.</p>
      <div class="btn-row"><button class="btn btn-primary" onclick="syncNow(true)">🔄 Sync now</button></div>
      <p style="font-size:11px;color:var(--text-3);margin-top:8px">Last sync: ${lastSync||'Never'}</p>
    </div>

    <div class="settings-panel">
      <h3>💾 Data Info</h3>
      <p style="font-size:13px;color:var(--text-2);margin-bottom:8px">Data stored locally + synced to Google Sheets cloud. Use Export/Import in Overview tab for extra backup.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center">
        <div style="background:var(--surface-2);padding:6px;border-radius:6px"><strong>${members.length}</strong><br><span style="color:var(--text-3)">Members</span></div>
        <div style="background:var(--surface-2);padding:6px;border-radius:6px"><strong>${budget.expenses.length}</strong><br><span style="color:var(--text-3)">Expenses</span></div>
        <div style="background:var(--surface-2);padding:6px;border-radius:6px"><strong>${tasks.length}</strong><br><span style="color:var(--text-3)">Tasks</span></div>
        <div style="background:var(--surface-2);padding:6px;border-radius:6px"><strong>${health.length}</strong><br><span style="color:var(--text-3)">Health</span></div>
        <div style="background:var(--surface-2);padding:6px;border-radius:6px"><strong>${grocery.length}</strong><br><span style="color:var(--text-3)">Grocery</span></div>
        <div style="background:var(--surface-2);padding:6px;border-radius:6px"><strong>${wishlist.length}</strong><br><span style="color:var(--text-3)">Wishlist</span></div>
      </div>
    </div>
  </div>`}

renderHeader();resetRecurring();renderTabs();renderContent();checkLock();
if(!me||!members.find(m=>m.id===me))setTimeout(pickMe,300);
syncNow().then(()=>{renderHeader();resetRecurring();autoBills()});
setInterval(()=>{if(!document.hidden&&!document.querySelector('.modal-bg.open'))syncNow()},45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
</script>
</body>
</html>
